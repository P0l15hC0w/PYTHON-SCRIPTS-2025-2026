<!DOCTYPE html>
<html lang="pl-PL">
    <head>
        <title>Clipboard</title>
        <style>
            body{
                font-family:Verdana, Geneva, Tahoma, sans-serif;
                background:#202124;
                color:white;
                margin:30px;
            }
            button{
                width: 60px;
                height: 30px;
                border: none;
                border-radius: 5px;
                font-weight: 700;
                font-size: 100%;
                color:#2e2e2e;
            }
            .container{
                display:flex;
                gap:30px;
                
            }
            .records{
                width:50%;
                max-height:500px;
                overflow-y:auto;
                overflow-x:hidden;
                border:1px solid #444;
                padding:10px;
                border-radius: 5px;
            }
            .record{
                border-bottom:1px solid #444;
                padding:10px;
            }
            .delete{
                background-color: rgb(243, 65, 65);
                color: rgb(223, 218, 218);
            }
            button{
                margin-left:5px;
            }
            form{
                width:40%;
            }
            input, textarea{
                width:100%;
                margin-bottom:10px;
                padding:5px;
                border-radius: 5px;
                border: none;
                background-color:#444;
                color:whitesmoke;
                font-size: 100%;
            }
            textarea{
                resize: none;
            }
        </style>
        <script>
            function copyText(text){
                navigator.clipboard.writeText(text)
                alert("Skopiowano!")
            }
            function confirmDelete(id){
                if(confirm("Usunąć ten rekord?")){
                    window.location="/delete/"+id
                }
            }
        </script>
    </head>
    <body>
        <h1>Clipboard</h1>
        <div class="container">
            <div class="records">
                {% for r in rows %}
                <div class="record">
                    <b>{{r[1]}}</b>
                    <button onclick="copyText(`{{r[2]}}`)">Kopiuj</button>
                    <button onclick="confirmDelete({{r[0]}})" class="delete">Usuń</button>
                    <br>
                    <small title="{{r[2]}}">
                    {{r[3]}}
                    </small>
                </div>
                {% endfor %}
            </div>
            <form method="POST" action="/add">
                <h3>Dodaj rekord</h3>
                <input name="name" placeholder="Nazwa" required>
                <textarea name="value" placeholder="Tekst do skopiowania" required></textarea>
                <textarea name="description" placeholder="Opis (opcjonalnie)"></textarea>
                <button type="submit">Zapisz</button>
            </form>
        </div>
    </body>
</html>
